<!DOCTYPE html>
<html><head><meta charset="utf-8"><style>body{margin:0;background:#333}</style></head>
<body>
<canvas id="c" width="605" height="931"></canvas>
<script>
const img = new Image();
img.onload = () => {
  const ctx = document.getElementById('c').getContext('2d');
  ctx.drawImage(img, 0, 0);
  ctx.strokeStyle = 'rgba(255,0,0,0.9)'; ctx.fillStyle = 'red'; ctx.font = '11px monospace';
  for (let x = 0; x <= 605; x += 50) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, 931); ctx.stroke(); ctx.fillText(x, x + 2, 12); }
  for (let y = 0; y <= 931; y += 50) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(605, y); ctx.stroke(); ctx.fillText(y, 2, y - 2); }
  document.title = 'ready';
};
img.src = '../assets/device-front.png';
</script>
</body></html>
